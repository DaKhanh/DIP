<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT EdWiser - Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #111, #333);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        
        header {
            width: 100%;
            background-color: #4a4a4a;
            padding: 10px 20px;
            position: absolute;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        header h1 {
            margin: 0;
            font-size: 26px;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            background-color: #555;
            padding: 10px 20px;
            margin-left: 10px;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        
        nav a:hover {
            background-color: #777;
        }
        
        .content {
            text-align: center;
            padding: 20px;
            height: 80%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        
        .chat-history {
            max-width: 80%; /* 增加对话框宽度至80% */
            margin: 20px auto; /* 让对话框水平居中 */
            padding: 20px;
            min-width: 900px; 
            background-color: transparent;
            border-radius: 10px;
            height: 60vh; /* 设置对话框高度为视口高度的60% */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        
        .message {
            font-size: 14px;
            white-space: pre-wrap;
            padding-left: 20px;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            max-width: 60%; /* 控制消息宽度 */
            word-wrap: break-word; /* 允许在长文本中自动换行 */
        }
        
        .user-message {
            background-color: #4a4a4a;
            align-self: flex-end;
            text-align: right;
            border-top-right-radius: 0; /* 模仿 GPT 风格的用户消息气泡 */
        }
        
        .bot-message {
            background-color: #555;
            align-self: flex-start;
            text-align: left;
            border-top-left-radius: 0; /* 模仿 GPT 风格的机器人消息气泡 */
        }
        
        .chatbox {
            width: 100%;
            background-color: #444;
            padding: 20px;
            position: fixed;
            bottom: 0;
            left: 0;
        }
        
        .chatbox form {
            display: flex;
            justify-content: center;
        }
        
        .chatbox input[type="text"] {
            padding: 15px;
            font-size: 18px;
            width: 70%; /* 减少输入框宽度以平衡布局 */
            max-width: 800px;
            border: none;
            border-radius: 5px;
            margin-right: 10px;
        }
        
        .chatbox input[type="submit"] {
            padding: 15px;
            font-size: 18px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .chatbox input[type="submit"]:hover {
            background-color: #777;
        }
    </style>
</head>
<body>
    <header>
        <h1>GPT EdWiser</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="chatbot.html">Chatbot</a>
            <a href="about.html">About Us</a>
            <a href="course_table_with_search.html">Course Table</a>
        </nav>
    </header>

    <section class="content">
        
        <!-- Chat History Section -->
        <div class="chat-history" id="chatHistory"></div>
    </section>

    <div class="chatbox">
        <form id="chatForm">
            <input type="text" id="question" placeholder="Ask GPT EdWiser">
            <input type="submit" value="Send">
        </form>
    </div>

    <script>
        document.getElementById("chatForm").addEventListener("submit", function(event) {
            event.preventDefault(); 
            
            const question = document.getElementById("question").value;
            const chatHistoryDiv = document.getElementById("chatHistory");

            if (question.trim() === "") return; // Ignore empty questions

            // Append user question to chat history
            const userMessage = document.createElement('div');
            userMessage.classList.add('message', 'user-message');
            userMessage.textContent = question;
            chatHistoryDiv.appendChild(userMessage);

            // Clear input
            document.getElementById("question").value = "";

            // Scroll to bottom of chat history
            chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;

            fetch('http://127.0.0.1:5000/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ question: question })
            })
            .then(response => response.json())
            .then(data => {
                // Append bot response to chat history
                const botMessage = document.createElement('div');
                botMessage.classList.add('message', 'bot-message');
                botMessage.textContent = data.answer;
                chatHistoryDiv.appendChild(botMessage);

                // Scroll to bottom of chat history
                chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
            })
            .catch(error => {
                console.error('Error:', error);
                const errorMessage = document.createElement('div');
                errorMessage.classList.add('message', 'bot-message');
                errorMessage.textContent = "An error occurred. Please try again.";
                chatHistoryDiv.appendChild(errorMessage);

                // Scroll to bottom of chat history
                chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
            });
        });
    </script>
</body>
</html>
