<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT EdWiser - Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #111, #333);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        header {
            width: 100%;
            background-color: #4a4a4a;
            padding: 10px 20px;
            position: absolute;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            margin: 0;
            font-size: 26px;
        }
        nav a {
            color: white;
            text-decoration: none;
            background-color: #555;
            padding: 10px 20px;
            margin-left: 10px;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        nav a:hover {
            background-color: #777;
        }
        .content {
            text-align: center;
            padding: 40px;
            animation: slideIn 1s ease;
        }
        .content h2 {
            font-size: 50px;
            margin-bottom: 20px;
        }
        .content ul {
            list-style: none;
            font-size: 24px;
            padding: 0;
            margin: 0 auto;
            max-width: 600px;
        }
        .chatbox {
            width: 100%;
            background-color: #444;
            padding: 20px;
            position: fixed;
            bottom: 0;
            left: 0;
        }
        .chatbox form {
            display: flex;
            justify-content: center;
        }
        .chatbox input[type="text"] {
            padding: 15px;
            font-size: 18px;
            width: 80%;
            max-width: 800px;
            border: none;
            border-radius: 5px;
            margin-right: 10px;
        }
        .chatbox input[type="submit"] {
            padding: 15px;
            font-size: 18px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .chatbox input[type="submit"]:hover {
            background-color: #777;
        }
        .response {
            margin-top: 20px;
            font-size: 18px;
            color: #eee;
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header>
        <h1>GPT EdWiser</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="chatbot.html">Chatbot</a>
            <a href="about.html">About Us</a>
        </nav>
    </header>

    <section class="content">
        <h2>Chatbot</h2>
        <ul>
            <li>Ask about NTU course information or requirements!</li>
        </ul>
        <div class="response" id="response">Response will appear here...</div>
    </section>

    <div class="chatbox">
        <form id="chatForm">
            <input type="text" id="question" placeholder="Ask GPT EdWiser">
            <input type="submit" value="Send">
        </form>
    </div>

    <script>
        document.getElementById("chatForm").addEventListener("submit", function(event) {
            event.preventDefault(); // 防止表单提交刷新页面
            
            const question = document.getElementById("question").value;
            const responseDiv = document.getElementById("response");

            // 调用后端 API
            fetch('http://127.0.0.1:5000/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ question: question })
            })
            .then(response => response.json())
            .then(data => {
                responseDiv.textContent = data.answer; // 显示返回的答案
            })
            .catch(error => {
                console.error('Error:', error);
                responseDiv.textContent = "An error occurred. Please try again.";
            });
        });
    </script>
</body>
</html>
